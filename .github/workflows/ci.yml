name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend (lint + tests on PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: reservaya
          POSTGRES_PASSWORD: reservaya
          POSTGRES_DB: reservaya_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reservaya"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENV: test
      DATABASE_URL: postgresql+psycopg://reservaya:reservaya@localhost:5432/reservaya_test
      TEST_DATABASE_URL: postgresql+psycopg://reservaya:reservaya@localhost:5432/reservaya_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Migrations
        run: alembic upgrade head

      - name: Tests with coverage
        run: pytest

      # La receta SQLite (FK + savepoints) es la que usan las pruebas locales: también se valida.
      - name: Tests on SQLite
        env:
          TEST_DATABASE_URL: ""
        run: pytest --no-cov
