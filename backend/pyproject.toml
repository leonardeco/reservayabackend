[project]
name = "reservaya-api"
version = "1.0.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

# backend/alembic/ es la carpeta de migraciones: sin esto ruff trataría el paquete
# alembic instalado como código propio al ordenar imports.
[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=app/services --cov=app/routers --cov-report=term-missing --cov-fail-under=70"
markers = ["postgres: requiere PostgreSQL (TEST_DATABASE_URL)"]

[tool.coverage.run]
branch = true
