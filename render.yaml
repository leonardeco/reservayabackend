# Despliegue del backend en Render (Blueprint): New → Blueprint → elegir este repositorio.
# Crea la API y una base PostgreSQL. Al arrancar aplica las migraciones.
services:
  - type: web
    name: reservaya-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: ENV
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: reservaya-db
          property: connectionString

databases:
  - name: reservaya-db
    plan: free
    databaseName: reservaya
    user: reservaya
